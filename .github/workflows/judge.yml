name: Judge

on:
  push:
    branches: [ "main" ]

jobs:

  dusk:
    runs-on: ubuntu-latest
    env:
      APP_URL: "http://127.0.0.1:8000"
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: shipyard
      MAIL_MAILER: log
      LANG: pl_PL.UTF-8
      LANGUAGE: pl_PL:pl
      LC_ALL: pl_PL.UTF-8
      MAIL_FROM_ADDRESS: archmage@test.test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: _shipyard
      - name: Install Laravel
        run: |
          composer create-project laravel/laravel:^12.0 shipyard-test . --prefer-dist --no-interaction
      - name: Prepare The Environment
        run: |
          cp _shipyard/tests/.env.example .env
          cp _shipyard/tests/composer.json composer.json
          cp -a _shipyard/tests .
      - name: Set up locale
        run: |
          sudo locale-gen pl_PL.UTF-8
          sudo update-locale LANG=pl_PL.UTF-8
      - name: Create Database
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`shipyard\` character set UTF8mb4 collate utf8mb4_bin;"
      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: ⚓ Install Shipyard
        run: php artisan shipyard:install
      - name: 🔑 Generate Application Key
        run: php artisan key:generate
      - name: Upgrade Chrome Driver
        run: php artisan dusk:chrome-driver --detect
      - name: Start Chrome Driver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &
      - name: Run Laravel Server
        run: php artisan serve --no-reload &
      - name: 🧪 Run Dusk Tests
        run: php artisan dusk
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/Browser/screenshots
      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console
          path: tests/Browser/console
